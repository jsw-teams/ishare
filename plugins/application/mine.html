<div class="mine-heading"><p class="eyebrow" data-i18n="workspaceEyebrow"></p><h1 data-i18n="newPost"></h1><div id="status" class="feedback" role="status" aria-live="polite"></div></div>
<p id="account-notice" role="status" hidden></p>
<div class="compose-layout" id="workspace">
<section class="panel upload-panel" aria-labelledby="upload-title"><h2 id="upload-title" data-i18n="storyPrompt"></h2>
<div id="publisher-gate" class="publisher-gate" role="status"><span class="gate-icon" aria-hidden="true">ISHARE_ICON_LOCK</span><div><h3 id="gate-title" data-i18n="gateTitle"></h3><p id="gate-message" data-i18n="gateHint"></p><a id="publisher-login" class="button button-primary" href="/auth" data-i18n="login"></a></div></div>
<div id="login-error" class="login-error" role="alert" hidden tabindex="-1"></div>
<form id="publish-form" class="publisher-locked"><fieldset disabled><label class="caption-field"><span data-i18n="description"></span><textarea name="caption" maxlength="5000" rows="6"></textarea></label>
<label class="file-picker"><span class="upload-symbol" aria-hidden="true">ISHARE_ICON_ADD</span><span data-i18n="attachments"></span><input id="media-file" name="file" type="file" multiple accept="image/jpeg,image/png,image/webp,image/avif,image/gif,video/mp4,video/webm,video/quicktime,video/x-matroska"></label>
<p id="selected-file" class="selected-file" hidden></p><div id="attachment-preview" class="attachment-preview" aria-live="polite"></div>
<div class="composer-actions"><label class="check"><input type="checkbox" name="listed"><span data-i18n="listed"></span></label><button class="button-primary publish-button" type="submit" data-i18n="publishNow"></button></div></fieldset></form></section>
<aside id="quota-summary" class="quota-summary" hidden aria-labelledby="quota-title"><h2 id="quota-title" data-i18n="myQuota"></h2><dl id="quota-cards"></dl><a id="compose-profile-link" class="button" hidden data-i18n="personalPage"></a></aside></div>
<dialog id="upload-status" class="upload-status" hidden aria-labelledby="upload-stage" tabindex="-1"><button id="cancel" class="upload-close" type="button" aria-label="Cancel upload">ISHARE_ICON_CLOSE</button>
<div class="upload-status-heading"><span id="upload-state-icon" class="upload-state-icon" aria-hidden="true"></span><div><strong id="upload-stage" aria-live="polite"></strong><p id="upload-current"></p></div><strong id="upload-percent"></strong></div>
<ol id="upload-phases" class="upload-phases"><li data-phase="transfer" data-i18n="transferPhase"></li><li data-phase="confirm" data-i18n="confirmPhase"></li><li data-phase="publish" data-i18n="publishPhase"></li></ol>
<progress id="progress" max="1" value="0" aria-labelledby="upload-stage"></progress><p id="upload-bytes"></p><p id="upload-result" role="status"></p>
<div id="publish-result" class="publish-result" hidden><p id="published-caption"></p><div class="result-actions"><a id="published-open" class="button button-primary" data-i18n="openPublished"></a><button id="published-share" type="button" data-i18n="sharePost"></button><a id="published-profile" class="button" data-i18n="personalPage"></a></div></div>
<button id="upload-dismiss" type="button" data-i18n="close" hidden></button></dialog>
